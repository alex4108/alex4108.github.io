---
layout: preview
description: My achievements and findings in Computer Science
sitemap: false
---

{% for post in site.posts limit: site.paginate %}

	<article class="post">

		{% if post.external-url %}
			<h1>
				<a href="{{ post.external-url }}">{{ post.title }}</a>
				<a class="anchor" href="{{ post.url }}"><i class="icon-anchor"></i></a>
			</h1>
		{% else %}
			<h1><a href="{{ post.url }}">{{ post.title }}</a></h1>
		{% endif %}

		<div class="post-content">{{ post.description }}<br /><i><a href="{{ post.url }}">Read more here</a></i></div>

	</article>

{% endfor %}

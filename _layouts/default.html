<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/colors-dark.css' | relative_url }}">
  <meta name="google-site-verification" content="KW_c2jmX2rqgRNGSkikiIsGAIIoMZbm3T_Rt0JLk8_Y">
  <meta name="msvalidate.01" content="957245CCB2EFACBCCD7AAEE509A1841C">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header id="header">
    <p class="site-title"><a href="{{ '/' | relative_url }}"><i class="icon-sun" aria-hidden="true"></i> {{ site.title }}</a></p>
    <p class="site-description">{{ site.tagline }}</p>
  </header>

  <div id="page">
    <aside id="sidebar">
      <nav aria-label="Primary navigation">
        <ul>
          <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
          <li><a href="{{ '/work/' | relative_url }}"{% if page.url == '/work/' %} aria-current="page"{% endif %}>Work</a></li>
          <li><a href="{{ '/archives/' | relative_url }}"{% if page.url == '/archives/' %} aria-current="page"{% endif %}>Writing / Archive</a></li>
          <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
          <li><a href="https://github.com/alex4108" rel="me external">GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/aschittko" rel="me external">LinkedIn</a></li>
          <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
        </ul>
      </nav>
    </aside>

    <main id="content" tabindex="-1">
      {{ content }}
    </main>
  </div>

  <footer id="footer">
    <p class="copyright">&copy; {{ site.time | date: '%Y' }} Alex Schittko.</p>
    <p class="site-credit">Built with <a href="https://jekyllrb.com" rel="external">Jekyll</a>. Original theme by <a href="https://www.webmaster-source.com" rel="external">Matt Harzewski</a>.</p>
  </footer>
</body>
</html>
